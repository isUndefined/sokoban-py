name: Sokoban UI smoke test
on:
  push:
    branches: [chore/github-access-check]
  pull_request:
    paths:
      - 'sokoban.py'
      - 'sokoban_theme.py'
      - 'sokoban_gui.py'
      - 'assets/storybook/**'
      - 'assets/hero_walk.png'
      - 'tests/**'
      - '.github/workflows/sokoban-ui.yml'
jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pygame
        run: python -m pip install -r requirements.txt
      - name: Run game rules tests
        run: python -m unittest discover -s tests -v
      - name: Render UI in SDL headless mode
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python tests/smoke_ui.py
      - name: Upload actual Pygame screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sokoban-real-pygame-frames
          path: artifacts/screenshots/
          if-no-files-found: warn
